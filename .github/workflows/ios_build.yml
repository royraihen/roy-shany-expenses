name: Build iOS IPA (Unsigned for Sideloadly / AltStore)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build_ios:
    name: Build iOS IPA on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y RoyShanyExpenses.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoyShanyExpenses-iOS-IPA
          path: RoyShanyExpenses.ipa
